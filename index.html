<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title></title>
        <link rel="icon" href="" />
        <meta name="description" content="" />
        <meta property="og:title" content="" />
        <meta property="og:description" content="" />
        <meta property="og:image" content="" />
        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    </head>

    <body
        class="max-w-3xl mx-auto my-10 px-6 font-mono text-sm leading-relaxed bg-white text-neutral-900 dark:bg-[#0d1117] dark:text-[#e6edf3] flex flex-col gap-10 antialiased"
    >
        <header
            class="flex items-center gap-5 pb-6 border-b border-neutral-200 dark:border-neutral-800"
        >
            <img
                id="avatar"
                alt="user avatar"
                style="width: 25vw"
                class="!w-20 !h-20 rounded-full object-cover border border-neutral-200 dark:border-neutral-800 shrink-0"
            />
            <div>
                <h1 id="name" class="text-xl font-bold tracking-tight"></h1>
                <p
                    id="bio"
                    class="text-xs text-neutral-600 dark:text-neutral-400 mt-1 empty:hidden"
                ></p>
                <a
                    id="github-link"
                    target="_blank"
                    rel="noopener noreferrer"
                    class="inline-block mt-1 text-xs text-neutral-500 hover:text-blue-600 dark:hover:text-blue-400"
                ></a>
            </div>
        </header>

        <div
            id="briefing"
            class="overflow-x-auto [&_h1]:text-lg [&_h1]:font-bold [&_h1]:mb-3 [&_h1]:pb-1.5 [&_h1]:border-b [&_h1]:border-neutral-200 dark:[&_h1]:border-neutral-800 [&_h2]:text-base [&_h2]:font-bold [&_h2]:mt-5 [&_h2]:mb-2 [&_h2]:pb-1 [&_h2]:border-b [&_h2]:border-neutral-200 dark:[&_h2]:border-neutral-800 [&_h3]:font-bold [&_h3]:mt-4 [&_h3]:mb-1.5 [&_p]:mb-3 [&_ul]:list-disc [&_ul]:pl-5 [&_ul]:mb-3 [&_ol]:list-decimal [&_ol]:pl-5 [&_ol]:mb-3 [&_a]:text-blue-600 dark:[&_a]:text-blue-400 [&_a:hover]:underline [&_code]:bg-neutral-100 dark:[&_code]:bg-neutral-800 [&_code]:px-1.5 [&_code]:py-0.5 [&_code]:rounded [&_img]:max-w-full [&_img]:h-auto [&_.anchor]:hidden"
        ></div>

        <div
            id="project"
            class="divide-y divide-neutral-200 dark:divide-neutral-800 border-t border-neutral-200 dark:border-neutral-800 [&>div]:py-5 [&_h3]:font-bold [&_h3]:text-base [&_h3]:mb-1 [&_h3_a]:text-blue-600 dark:[&_h3_a]:text-blue-400 [&_h3_a:hover]:underline [&_p]:text-neutral-600 dark:[&_p]:text-neutral-400 [&_p]:mb-2 [&_.repo-meta]:text-xs [&_.repo-meta]:text-neutral-500"
        ></div>

        <script type="module">
            async function fetchcached(url) {
                const key = Array.from(url, (c) => c.charCodeAt(0)).reduce(
                    (acc, n) => acc + `${n}`,
                    "",
                );
                const cached = localStorage.getItem(key);
                const parsed = cached ? JSON.parse(cached) : null;

                if (parsed && Date.now() - parsed.timestamp < 3600000) {
                    return parsed.data;
                }

                try {
                    const res = await fetch(url, {
                        headers: { Accept: "application/vnd.github.html+json" },
                    });
                    if (!res.ok) throw new Error(`error: ${res.status}`);

                    const data = await res.text();
                    localStorage.setItem(
                        key,
                        JSON.stringify({ timestamp: Date.now(), data }),
                    );
                    return data;
                } catch (err) {
                    if (parsed) return parsed.data;
                    throw err;
                }
            }

            const USERNAME = "loicguezo";
            const briefing = document.getElementById("briefing");
            const project = document.getElementById("project");

            // fetching github user profile & metadata
            try {
                const rawUser = await fetchcached(
                    `https://api.github.com/users/${USERNAME}`,
                );
                const user = JSON.parse(rawUser);
                const fullName = user.name || USERNAME;
                const bio = user.bio || "";

                document.title = fullName;
                document.querySelector('link[rel="icon"]').href =
                    `${user.avatar_url}&s=64`;
                document.querySelector('meta[name="description"]').content =
                    bio;
                document.querySelector('meta[property="og:title"]').content =
                    fullName;
                document.querySelector(
                    'meta[property="og:description"]',
                ).content = bio;
                document.querySelector('meta[property="og:image"]').content =
                    user.avatar_url;

                document.getElementById("avatar").src = user.avatar_url;
                document.getElementById("name").textContent = fullName;
                document.getElementById("bio").textContent = bio;

                const githubLink = document.getElementById("github-link");
                githubLink.href = user.html_url;
                githubLink.innerHTML = `github.com/${USERNAME} &nearr;`;
            } catch (err) {
                document.getElementById("name").textContent = USERNAME;
            }

            // fetching github showcase repository
            try {
                briefing.innerHTML = await fetchcached(
                    `https://api.github.com/repos/${USERNAME}/${USERNAME}/readme`,
                );
            } catch (err) {
                briefing.innerHTML = `error: ${err}`;
            }

            // fetching the most popular github repositories
            try {
                const rawRepos = await fetchcached(
                    `https://api.github.com/users/${USERNAME}/repos?per_page=100`,
                );
                const repos = JSON.parse(rawRepos);

                repos.forEach((repo) => {
                    const pCard = document.createElement("div");
                    pCard.innerHTML = `
                    <h3><a href="${repo.html_url}" target="_blank" rel="noopener noreferrer">${repo.name}</a></h3>
                    <p>${repo.description ? repo.description : "No description"}</p>
                    <div class="repo-meta">
                        stars: ${repo.stargazers_count} &nbsp;|&nbsp;
                        ${repo.language ? repo.language : "—"}
                    </div>`;
                    project.appendChild(pCard);
                });
            } catch (err) {
                project.innerHTML = `error: ${err}`;
            }
        </script>
    </body>
</html>
